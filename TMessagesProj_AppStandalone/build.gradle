apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

// Keep personal signing credentials in the ignored root local.properties file.
def localSigning = new Properties()
def localSettingsFile = rootProject.file('local.properties')
if (localSettingsFile.exists()) {
    localSettingsFile.withInputStream { localSigning.load(it) }
}
def signingValue = { String name -> localSigning.getProperty(name) ?: project.findProperty(name) }

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE


    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        debug {
            storeFile rootProject.file(signingValue("MOAGRAM_KEYSTORE_FILE") ?: "TMessagesProj/config/release.keystore")
            storePassword (signingValue("MOAGRAM_STORE_PASSWORD") ?: RELEASE_STORE_PASSWORD)
            keyAlias (signingValue("MOAGRAM_KEY_ALIAS") ?: RELEASE_KEY_ALIAS)
            keyPassword (signingValue("MOAGRAM_KEY_PASSWORD") ?: RELEASE_KEY_PASSWORD)
        }

        release {
            storeFile rootProject.file(signingValue("MOAGRAM_KEYSTORE_FILE") ?: "TMessagesProj/config/release.keystore")
            storePassword (signingValue("MOAGRAM_STORE_PASSWORD") ?: RELEASE_STORE_PASSWORD)
            keyAlias (signingValue("MOAGRAM_KEY_ALIAS") ?: RELEASE_KEY_ALIAS)
            keyPassword (signingValue("MOAGRAM_KEY_PASSWORD") ?: RELEASE_KEY_PASSWORD)
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".web"
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            // Reserve a fork revision digit without editing Telegram's version properties.
            def moagramRevision = Integer.parseInt(MOAGRAM_VERSION_REVISION)
            if (moagramRevision < 0 || moagramRevision > 9) throw new GradleException('Moagram revision must be 0..9')
            output.versionCodeOverride = defaultConfig.versionCode * 100 + moagramRevision * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionName APP_VERSION_NAME + '-Moagram.' + (Integer.parseInt(MOAGRAM_VERSION_REVISION) + 1)
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-23' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

apply plugin: 'com.google.gms.google-services'
