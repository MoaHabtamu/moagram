name: Android checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_apk:
        description: Also build a CI-only standalone APK (no login credentials)
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact candidate commit to check
        type: string
        required: true
      build_apk:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upstream-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: |
          python3 Tools/tests/test-upstream-sync.py
          python3 Tools/tests/test-update-feed.py

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default includes Google's retired "tools" package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Configure a build without personal credentials
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Compile Java and run repeat regression checks
        run: |
          bash gradlew :TMessagesProj:compileStandaloneJavaWithJavac --console=plain --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g'
          bash Tools/tests/run-local-repeats.sh
      - name: Build CI-only APK
        if: inputs.build_apk == true
        run: bash gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --console=plain --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g'
      - name: Save CI-only APK
        if: inputs.build_apk == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-only-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/*.apk
          if-no-files-found: error
          retention-days: 7
